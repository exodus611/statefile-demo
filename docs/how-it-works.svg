<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="How statefile works: your project files are checked on every push; a rotten state file fails the check, a fixed one passes">
  <defs>
    <style>
      .t  { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .h  { font-size: 15px; font-weight: 600; fill: #111827; }
      .s  { font-size: 12.5px; fill: #4b5563; }
      .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
      .box   { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
      .red   { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1.5; }
      .green { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.5; }
      .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <text class="t h" x="30" y="34">How statefile works</text>
  <text class="t s" x="30" y="55">One command locally, or one file in CI. Nothing is installed on your machine, nothing is sent anywhere.</text>

  <!-- 1 -->
  <rect class="box" x="30" y="90" width="250" height="150" rx="10"/>
  <text class="t h" x="48" y="120">Your project</text>
  <text class="t s" x="48" y="145">STATE.md — what runs, what is</text>
  <text class="t s" x="48" y="163">in flight, decisions, dead ends,</text>
  <text class="t s" x="48" y="181">next three tasks</text>
  <text class="t s" x="48" y="207">CLAUDE.md / AGENTS.md — rules</text>
  <text class="t s" x="48" y="228">(dotfiles, in the repository)</text>

  <path class="arrow" d="M 285 165 L 335 165"/>

  <!-- 2 -->
  <rect class="box" x="340" y="90" width="230" height="150" rx="10"/>
  <text class="t h" x="358" y="120">statefile check</text>
  <text class="t s" x="358" y="146">· is the state file there?</text>
  <text class="t s" x="358" y="166">· is it fresh?</text>
  <text class="t s" x="358" y="186">· five sections?</text>
  <text class="t s" x="358" y="206">· any secret inside?</text>
  <text class="t s" x="358" y="226">· outdated rules?</text>

  <path class="arrow" d="M 575 130 C 605 130 615 122 645 122"/>
  <path class="arrow" d="M 575 200 C 605 200 615 208 645 208"/>

  <!-- 3 red -->
  <rect class="red" x="650" y="86" width="220" height="72" rx="10"/>
  <text class="t m" x="668" y="114" fill="#b91c1c">FAIL  STATE_STALE (47 days)</text>
  <text class="t m" x="668" y="134" fill="#b91c1c">FAIL  SECRET_IN_STATE</text>

  <!-- 3 green -->
  <rect class="green" x="650" y="176" width="220" height="72" rx="10"/>
  <text class="t m" x="668" y="204" fill="#15803d">OK  state file present</text>
  <text class="t m" x="668" y="224" fill="#15803d">OK  fresh, no secrets</text>

  <!-- captions -->
  <text class="t s" x="650" y="78">the file rotted</text>
  <text class="t s" x="650" y="268">five minutes later</text>

  <text class="t s" x="30" y="290">Red means the project is about to trust something nobody has checked since August. Green means the memory is real.</text>
  <text class="t s" x="30" y="309">The badge in a README is this same check — it tells the truth whether you look at it or not.</text>
</svg>
